<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Smart Utility Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="{{ url_for('converter') }}"><span class="brand-mark" aria-hidden="true">◇</span> <span>Smart Utility<br>Hub</span></a>
    <nav aria-label="Utilities">
      <a href="{{ url_for('converter') }}" {% if active == 'converter' %}aria-current="page"{% endif %}><span aria-hidden="true">⇄</span> Unit converter</a>
      <a href="{{ url_for('billing') }}" {% if active == 'billing' %}aria-current="page"{% endif %}><span aria-hidden="true">▤</span> Retail billing</a>
    </nav>
  </aside>
  <main class="workspace">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
